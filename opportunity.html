<style>

    --shadow:0 1px 2px rgba(16,23,41,.04),0 12px 30px -16px rgba(16,23,41,.18);--radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px 64px}
  .hero{margin:0 -24px 26px;padding:34px 24px 30px;background:

  .hero .inner{max-width:1320px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .mark{display:flex;align-items:center;gap:13px;margin-bottom:14px}
  .glyph{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(79,70,229,.6)}
  .glyph svg{width:21px;height:21px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#A9B2D8;font-weight:600}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:31px;line-height:1.05;margin:5px 0 0;letter-spacing:-0.02em}
  h1 .sub{color:#8C96C2;font-weight:500}
  .hmeta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A9B2D8;text-align:right;line-height:1.8}
  .hmeta b{color:#fff;font-weight:600}
  .badge-src{display:inline-block;margin-top:6px;font-size:10.5px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.1);color:#C7CEE8}
  .insight{margin-top:18px;display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:9px 15px;border-radius:11px;font-size:13px;color:#E7EAF6}

  .insight .ic{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(14,159,110,.25)}
  .navlinks{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
  .navlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:8px 15px;border-radius:10px}
  .navlink:hover{background:rgba(255,255,255,.2)}
  .navlink.active{background:#fff;color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(16,23,41,.04),0 18px 38px -18px rgba(16,23,41,.26)}
  .kpi .accent{position:absolute;left:0;top:0;bottom:0;width:3px}
  .kpi .label{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .val{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1}
  .kpi .foot{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);margin-top:9px}
  .k1 .accent{background:var(--primary)} .k2 .accent{background:var(--aio)} .k3 .accent{background:var(--teal)} .k4 .accent{background:var(--green)}

  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .search{flex:1;min-width:180px;position:relative}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font-family:inherit;font-weight:500;font-size:12.5px;padding:8px 13px;border-radius:9px;cursor:pointer;transition:all .12s ease;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:#cfd3e0}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .c{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.65}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:500;font-size:12.5px;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
  .btn:hover{border-color:#cfd3e0} .btn svg{width:15px;height:15px}
  .resultbar{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin:2px 2px 12px}
  .resultbar b{color:var(--ink)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:960px}
  thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);background:#FBFCFE;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;z-index:2}
  thead th:hover{color:var(--ink)} thead th.num{text-align:right}
  thead th .arrow{opacity:0;font-size:9px;margin-left:4px}
  thead th[data-active="true"]{color:var(--ink)} thead th[data-active="true"] .arrow{opacity:1}
  tbody td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FBFBFE}
  .prod{font-weight:600;max-width:200px}
  .page a{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--primary);text-decoration:none;max-width:210px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
  .page a:hover{text-decoration:underline}
  .num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .pcat{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap}

  .pcat.mid{color:var(--aio);background:var(--aio-soft)}
  .pcat.low{color:var(--muted);background:#EEF0F5}

  .dm .ti{color:var(--faint);font-size:11px}

  .empty{padding:54px 20px;text-align:center;color:var(--muted)}
  .empty strong{display:block;color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:16px;margin-bottom:6px}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;flex-wrap:wrap}
  .pager .info{font-size:12.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
  .pbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);cursor:pointer}

</style>
</head>

r%20CEO", "tier": "low", "proposal_path": "proposals/low/jackrabbit-dance.html", "fundable": false, "enterprise_flag": false}];
const PRE="https://www.softwaresuggest.com";
const SITE_BASE="https://tirth-automation.github.io/ss-ai/";
const WORKER_URL="https://apollo-proxy.aeogeo.workers.dev";
const LEADS = RAW.map((d,i)=>({ ...d, rank:i+1, uid:i }));
let filter="all", sortKey="total", sortDir="desc", page=1;
const PER=30;
const fmt=n=>n==null?"—":Math.round(n).toLocaleString("en-US");
const $=id=>document.getElementById(id);
let filtered=[];

function tierLabel(t){ return t==="high"?"Dominate":(t==="mid"?"Scale":"Launch"); }
function tierPrice(t){ return t==="high"?"$10,000/mo":(t==="mid"?"$5,000/mo":"$2,500 one-time"); }

function buildMailto(d){
  const proposalUrl = SITE_BASE + d.proposal_path;
  const greeting = d.dm_name ? `Hi ${d.dm_name.split(" ")[0]},` : "Hi,";
  const subject = `${d.name} is already showing up in AI answers — quick visibility snapshot`;
  const bodyLines = [
    greeting,
    "",
    `I pulled a quick AI-visibility snapshot for ${d.name}'s SoftwareSuggest listing (softwaresuggest.com${d.path}) — it's already being cited ${d.total} time(s) across AI Overviews, ChatGPT, Gemini and Perplexity.`,
    "",
    `Full breakdown + recommended plan (${tierLabel(d.tier)}, ${tierPrice(d.tier)}) here: ${proposalUrl}`,
    "",
    "Happy to walk through it if useful — let me know a good time.",
    "",
    "Best,",
    "SoftwareSuggest AEO/GEO Team",
  ];
  const body = bodyLines.join("\n");
  return `mailto:${encodeURIComponent(d.dm_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function init(){
  const totalCites=LEADS.reduce((a,d)=>a+d.total,0);
  const highCount=LEADS.filter(d=>d.tier==="high").length;
  const namedCount=LEADS.filter(d=>d.dm_name).length;
  const fundableCount=LEADS.filter(d=>d.fundable).length;
  $("insight").innerHTML=`<span class="ic"></span><span><b>${fmt(LEADS.length)}</b> products are already cited by AI engines on softwaresuggest.com. <b>${fmt(fundableCount)}</b> are realistic $2,000+/mo prospects (mid/high tier, excluding free tools); every row has a one-click contact search and a personalized proposal.</span>`;
  const cards=[
    {c:"k1",label:"Total cited products",val:fmt(LEADS.length),foot:"across all AI engines"},
    {c:"k2",label:"Can pay $2,000+/mo",val:fmt(fundableCount),foot:"mid/high tier, free tools excluded"},
    {c:"k3",label:"Total citations",val:fmt(totalCites),foot:"summed across products"},
    {c:"k4",label:"Named decision-makers",val:fmt(namedCount),foot:"verified via public research"},
  ];
  $("kpis").innerHTML=cards.map(c=>`<div class="kpi ${c.c}"><span class="accent"></span><div class="label">${c.label}</div><div class="val">${c.val}</div><div class="foot">${c.foot}</div></div>`).join("");
  document.querySelector('[data-c="all"]').textContent=fmt(LEADS.length);
  document.querySelector('[data-c="fundable"]').textContent=fmt(fundableCount);
  document.querySelector('[data-c="high"]').textContent=fmt(highCount);
  document.querySelector('[data-c="mid"]').textContent=fmt(LEADS.filter(d=>d.tier==="mid").length);
  document.querySelector('[data-c="low"]').textContent=fmt(LEADS.filter(d=>d.tier==="low").length);
  document.querySelector('[data-c="named"]').textContent=fmt(namedCount);
  bindEvents();
  compute();
}

function compute(){
  const q=$("q").value.trim().toLowerCase();
  filtered=LEADS.filter(d=>{
    if(filter==="named"&&!d.dm_name) return false;
    if(filter==="fundable"&&!d.fundable) return false;
    if(!["all","named","fundable"].includes(filter)&&d.tier!==filter) return false;
    if(q&&!d.name.toLowerCase().includes(q)) return false;
    return true;
  });
  filtered.sort((a,b)=>{let av=a[sortKey],bv=b[sortKey];
    if(["name","path","tier","dm_name"].includes(sortKey)){av=av||"";bv=bv||"";return sortDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);}
    return sortDir==="asc"?av-bv:bv-av;});
  const mp=Math.max(1,Math.ceil(filtered.length/PER));if(page>mp)page=mp;
  $("resultbar").innerHTML=`<b>${fmt(filtered.length)}</b> leads shown`;
  render();
}

function render(){
  const mp=Math.max(1,Math.ceil(filtered.length/PER));
  const start=(page-1)*PER, slice=filtered.slice(start,start+PER);
  const maxTotal=Math.max(...LEADS.map(d=>d.total));
  $("rows").innerHTML=slice.length?slice.map(d=>{
    const dmNameBlock = d.dm_name
      ? `<span class="nm">${d.dm_name}</span><span class="ti">${d.dm_title||""}</span>`
      : `<span class="none">Not publicly documented</span>`;
    const enrichBtn = !d.dm_email
      ? `<button class="enrich-btn" data-uid="${d.uid}" style="margin-top:4px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--primary-soft);color:var(--primary);border:none;cursor:pointer">🔍 Enrich via Apollo</button>`
      : "";
    const dm=`<span class="dm" id="dm-${d.uid}">${dmNameBlock}</span> ${enrichBtn}`;
    const liQuery=encodeURIComponent((d.dm_name?d.dm_name+" ":"")+d.name+" founder OR CEO OR director");
    const liUrl="https://www.linkedin.com/search/results/people/?keywords="+liQuery;
    const emailDisplay = d.dm_email
      ? `<a href="mailto:${d.dm_email}" style="font-weight:600;color:var(--primary);text-decoration:none;word-break:break-all">${d.dm_email}</a>${d.dm_phone?`<span class="direct" style="display:block;margin-top:3px">${d.dm_phone}</span>`:""}${d.dm_linkedin?`<a href="${d.dm_linkedin}" target="_blank" rel="noopener" style="display:block;margin-top:3px;font-size:11px;color:#2557A7">LinkedIn profile →</a>`:""}`
      : (d.dm_linkedin
          ? `<a href="${d.dm_linkedin}" target="_blank" rel="noopener" style="font-size:11.5px;color:#2557A7">LinkedIn profile →</a><span style="display:block;font-size:11px;color:var(--faint);margin-top:2px">No email yet</span>`
          : `<span style="color:var(--faint);font-size:12px">No email yet</span>`);
    return `<tr>
    <td>${d.rank}</td>
    <td class="prod">${d.name}</td>
    <td class="page"><a href="${PRE}${d.path}" target="_blank" rel="noopener" title="${PRE}${d.path}">softwaresuggest.com${d.path}</a></td>
    <td class="num"><span class="citebar"><span class="track"><span class="fillc" style="width:${Math.round(d.total/maxTotal*100)}%"></span></span>${fmt(d.total)}</span></td>
    <td class="num">${fmt(d.aio)}</td>
    <td class="num">${fmt(d.chatgpt)}</td>
    <td class="num">${fmt(d.gemini)}</td>
    <td class="num">${fmt(d.perplexity)}</td>
    <td><span class="pcat ${d.tier}">${d.tier==="high"?"High":d.tier==="mid"?"Mid":"Low"}</span>${d.fundable?'<span class="pcat" style="background:var(--green-soft);color:var(--green);margin-left:4px">💰 $2k+/mo</span>':''}${d.enterprise_flag?'<span class="pcat" style="background:#F1F2F6;color:var(--faint);margin-left:4px" title="Large/public company — has budget but unlikely to respond to cold outreach from a small agency">🏢 Enterprise</span>':''}</td>
    <td>${dm}</td>
    <td class="contactcell">${emailDisplay}</td>
    <td><a href="${d.proposal_path}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;background:var(--aio-soft);color:var(--aio);text-decoration:none;white-space:nowrap">View proposal →</a></td>
    <td>${d.dm_email
      ? `<a href="${buildMailto(d)}" style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;background:var(--green-soft);color:var(--green);text-decoration:none;white-space:nowrap">✉️ Send Email</a>`
      : `<span style="font-size:11px;color:var(--faint)">Enrich first</span>`}</td>
  </tr>`;}).join("")
    :`<tr><td colspan="13"><div class="empty"><strong>No leads match</strong>Adjust search or filter.</div></td></tr>`;
  $("pageInfo").textContent=`${filtered.length?start+1:0}–${Math.min(start+PER,filtered.length)} of ${fmt(filtered.length)}`;
  $("pageNum").textContent=`${page} / ${mp}`;$("prev").disabled=page<=1;$("next").disabled=page>=mp;
}

function bindEvents(){
  $("q").addEventListener("input",()=>{page=1;compute();});
  $("rows").addEventListener("click", async (e)=>{
    const btn=e.target.closest(".enrich-btn");
    if(!btn) return;
    const uid=+btn.dataset.uid;
    const lead=LEADS.find(x=>x.uid===uid);
    if(!lead) return;
    btn.disabled=true;
    btn.textContent="Enriching…";
    try{
      const r=await fetch(WORKER_URL+"/enrich",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({company_name:lead.name}),
      });
      const data=await r.json();
      if(data.error){
        btn.textContent="Error — retry";
        btn.disabled=false;
        console.error("Enrich error:", data.error);
        return;
      }
      lead.dm_name=data.dm_name||"";
      lead.dm_title=data.dm_title||"";
      lead.dm_email=data.dm_email||"";
      lead.dm_linkedin=data.dm_linkedin||"";
      if(!lead.dm_name){
        btn.textContent="No match found";
      } else {
        render();
      }
    }catch(err){
      btn.textContent="Error — retry";
      btn.disabled=false;
      console.error(err);
    }
  });
  $("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));filter=b.dataset.f;page=1;compute();});
  document.querySelectorAll("th[data-sort]").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.sort;
    if(sortKey===k)sortDir=sortDir==="asc"?"desc":"asc";else{sortKey=k;sortDir=["name","path","tier","dm_name"].includes(k)?"asc":"desc";}
    document.querySelectorAll("th[data-sort]").forEach(t=>{t.dataset.active=(t===th);const a=t.querySelector(".arrow");if(a)a.textContent=sortDir==="asc"?"▲":"▼";});render();}));
  $("prev").addEventListener("click",()=>{if(page>1){page--;render();}});
  $("next").addEventListener("click",()=>{page++;render();});
  $("csv").addEventListener("click",()=>{
    const head=["Rank","Product","Page","Total citations","AIO","ChatGPT","Gemini","Perplexity","Tier","Can pay $2000+/mo","Decision Maker","Title","Email","Phone","LinkedIn Search","Proposal"];
    const esc=s=>`"${String(s??"").replace(/"/g,'""')}"`;
    const lines=[head.join(",")].concat(LEADS.map(d=>{
      const liQuery=encodeURIComponent((d.dm_name?d.dm_name+" ":"")+d.name+" founder OR CEO OR director");
      const liUrl="https://www.linkedin.com/search/results/people/?keywords="+liQuery;
      return [d.rank,d.name,PRE+d.path,d.total,d.aio,d.chatgpt,d.gemini,d.perplexity,d.tier,d.fundable?"Yes":"No",d.dm_name,d.dm_title,d.dm_email,d.dm_phone,liUrl,d.proposal_path].map(esc).join(",");
    }));
    const blob=new Blob([lines.join("\n")],{type:"text/csv"});const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=`opportunity-leads-full_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);});
}
init();
</script>
